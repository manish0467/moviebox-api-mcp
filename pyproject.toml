[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moviebox-api-mcp"
version = "0.1.0"
description = "MCP server wrapping Movie Release Tracker and TuneFind Tracker APIs"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
moviebox-mcp = "mcp_server:main"